apiVersion: apps/v1
kind: Deployment
metadata: { name: finmind }
spec:
  replicas: 2
  selector: { matchLabels: { app: finmind } }
  template:
    metadata: { labels: { app: finmind } }
    spec:
      containers:
        - name: api
          image: finmind:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: llm-keys, optional: true } }]
          readinessProbe: { httpGet: { path: /api/health, port: 8000 }, periodSeconds: 10 }
          resources: { requests: { cpu: "500m", memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: finmind }
spec:
  selector: { app: finmind }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: finmind }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: finmind }
  minReplicas: 2
  maxReplicas: 8
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
